<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Setup - Lost & Found</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg">
                    <div class="card-header bg-success text-white text-center py-4">
                        <h2 class="mb-0">⚙️ Initial Setup</h2>
                        <p class="text-white-50 mb-0">Create First Admin Account</p>
                    </div>
                    <div class="card-body p-5">
                        <p class="text-muted mb-4">This appears to be the first time setup. Create your admin account to get started.</p>
                        
                        <form id="setupForm">
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-user"></i> Admin Username</label>
                                <input type="text" class="form-control form-control-lg" id="username" name="username" placeholder="Choose admin username" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-lock"></i> Password</label>
                                <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Enter password" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label"><i class="fas fa-lock"></i> Confirm Password</label>
                                <input type="password" class="form-control form-control-lg" id="confirm_password" name="confirm_password" placeholder="Confirm password" required>
                            </div>
                            <button type="submit" class="btn btn-success btn-lg w-100">Create Admin Account</button>
                        </form>
                        
                        <div id="message" class="alert mt-3" style="display:none;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('setupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            
            fetch('{{ url_for("create_first_admin") }}', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                const msgDiv = document.getElementById('message');
                if (data.success) {
                    msgDiv.className = 'alert alert-success mt-3';
                    msgDiv.textContent = data.message;
                    msgDiv.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = '{{ url_for("login") }}';
                    }, 2000);
                } else {
                    msgDiv.className = 'alert alert-danger mt-3';
                    msgDiv.textContent = data.message;
                    msgDiv.style.display = 'block';
                }
            });
        });
    </script>
</body>
</html>
