<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Lost Item - Lost & Found</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('user_search') }}"><i class="fas fa-search"></i> Lost & Found</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('user_search') }}">Search Items</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('login') }}">Admin Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-lg">
                    <div class="card-header bg-danger text-white">
                        <h4 class="mb-0"><i class="fas fa-file-alt"></i> Report Lost Item</h4>
                    </div>
                    <div class="card-body p-4">
                        <p class="text-muted mb-4">Fill out this form to report a lost item. Our admin team will help match it with any found items in our system.</p>

                        <form id="reportLostForm">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold"><i class="fas fa-user-circle"></i> Student Name *</label>
                                    <input type="text" class="form-control form-control-lg" name="student_name" placeholder="Enter your name" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold"><i class="fas fa-id-card"></i> Admission Number <small class="text-muted">(Optional)</small></label>
                                    <input type="text" class="form-control form-control-lg" name="admission_no" placeholder="Your admission number (if known)">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold"><i class="fas fa-tag"></i> Item Type *</label>
                                <select class="form-select form-select-lg" id="item_type_id" name="item_type_id" required onchange="updateItemFields()">
                                    <option value="">-- Select Item Type --</option>
                                    {% for item_type in item_types %}
                                    <option value="{{ item_type.id }}">{{ item_type.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div id="dynamicFieldsContainer"></div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold"><i class="fas fa-calendar"></i> Date Lost *</label>
                                    <input type="date" class="form-control form-control-lg" name="date_lost" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold"><i class="fas fa-map-marker-alt"></i> Location Lost *</label>
                                    <input type="text" class="form-control form-control-lg" name="location_lost" placeholder="Where did you lose it?" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold"><i class="fas fa-phone"></i> Contact Information *</label>
                                <input type="text" class="form-control form-control-lg" name="contact_info" placeholder="Phone or Email" required>
                            </div>

                            <div id="message" class="alert" style="display:none;"></div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-danger btn-lg"><i class="fas fa-paper-plane"></i> Submit Report</button>
                                <a href="{{ url_for('user_search') }}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const itemTypes = {{ item_types_data | tojson }};

        function updateItemFields() {
            const typeId = document.getElementById('item_type_id').value;
            const container = document.getElementById('dynamicFieldsContainer');
            container.innerHTML = '';

            if (!typeId) return;

            const selectedType = itemTypes.find(t => t.id == typeId);
            if (selectedType && selectedType.fields) {
                selectedType.fields.forEach((field) => {
                    const fieldLabel = field.replace(/_/g, ' ').toUpperCase();
                    let inputType = 'text';

                    const html = `
                        <div class="mb-3">
                            <label class="form-label fw-bold"><i class="fas fa-info-circle"></i> ${fieldLabel} *</label>
                            <input type="${inputType}" class="form-control form-control-lg" 
                                   name="desc_${field}" 
                                   placeholder="Enter ${fieldLabel.toLowerCase()}" 
                                   required>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', html);
                });
            }
        }

        document.getElementById('reportLostForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            
            fetch('{{ url_for("report_lost") }}', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                const msgDiv = document.getElementById('message');
                if (data.success) {
                    let message = '✓ ' + data.message;
                    
                    // Check for match suggestion
                    if (data.match_suggestion) {
                        const match = data.match_suggestion;
                        message += `<br><br><div class="alert alert-info mt-3">
                            <h6><i class="fas fa-lightbulb"></i> Possible Match Found!</h6>
                            <p><strong>${match.item_type}</strong> found on ${match.date_found} at ${match.location}</p>
                            <p><em>Match reason: ${match.match_reason}</em></p>
                            <p class="mb-0">Our admin team will review this potential match. You will be notified if it's a match!</p>
                        </div>`;
                    } else {
                        message += ' Your report has been submitted and our admin will check for matches.';
                    }
                    
                    msgDiv.className = 'alert alert-success';
                    msgDiv.innerHTML = message;
                    msgDiv.style.display = 'block';
                    
                    if (!data.match_suggestion) {
                        setTimeout(() => {
                            window.location.href = '{{ url_for("user_search") }}';
                        }, 3000);
                    }
                } else {
                    msgDiv.className = 'alert alert-danger';
                    msgDiv.textContent = '✗ Error: ' + data.message;
                    msgDiv.style.display = 'block';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('message').className = 'alert alert-danger';
                document.getElementById('message').textContent = 'An error occurred: ' + error;
                document.getElementById('message').style.display = 'block';
            });
        });
    </script>
</body>
</html>
